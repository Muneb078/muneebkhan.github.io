<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color:white;
}

.card{
    background: rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    max-width:400px;
    width:90%;
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

p{
    font-size:16px;
    margin-bottom:25px;
    opacity:0.9;
}

.btn{
    display:inline-block;
    padding:12px 25px;
    background:#00c6ff;
    color:white;
    text-decoration:none;
    border-radius:50px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#0072ff;
    transform:scale(1.05);
}

.footer{
    margin-top:20px;
    font-size:12px;
    opacity:0.7;
}

</style></head>
<body><div class="card">
    <h1>Welcome to My Website 🚀</h1>
    <p>Explore my latest article and updates in a simple and fast way.</p><a class="btn" href="sportzfy.html">Read Sportzfy Article</a>

<div class="footer">
    Created with passion ✨
</div>

</div></body>
</html>
